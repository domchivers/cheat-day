# The Cheat Days iPhone app. XcodeGen turns this into CheatDays.xcodeproj on the Mac:
#   brew install xcodegen && cd native && xcodegen generate
# Being rebuilt natively in SwiftUI, a stage at a time. Native so far: sign-in, Today, adding food, Me,
# Workouts (live sessions, routines, exercises), barcode scanning, photos of packs and labels, typing numbers,
# sync with the same account as the website, the lock-screen workout timer and haptics.
# Friends (people, cheers, requests). Still web inside the app: the feed, the assistant and the pages under Me.
name: CheatDays
options:
  bundleIdPrefix: com.cheatdays
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.65"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CheatDays:
    type: application
    platform: iOS
    sources:
      - path: CheatDays
      - path: Shared
    dependencies:
      - target: RestTimer
    info:
      path: CheatDays/Info.plist
      properties:
        CFBundleDisplayName: Cheat Days
        CFBundleURLTypes:
          - CFBundleURLName: com.cheatdays.app
            CFBundleURLSchemes: [cheatdays]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSCameraUsageDescription: Cheat Days uses the camera to scan barcodes, take photos of food labels and packs, and take photos and videos for your story.
        NSPhotoLibraryUsageDescription: Cheat Days lets you pick a photo of food or a label from your library, and shows your recent photos and videos to add to your story or a post.
        NSPhotoLibraryAddUsageDescription: Cheat Days saves your stories and videos to Photos when you tap Save.
        NSLocationWhenInUseUsageDescription: Cheat Days uses your suburb to find places to eat near you when you ask, and only the suburb's name is used for that. When you choose to map your runs, rides and walks, it follows your route with GPS while the app times one. Routes stay on your phone and in Apple Health.
        NSLocationDefaultAccuracyReduced: true
        # precise location for a timed run only (RunTracker asks for it with this key)
        NSLocationTemporaryUsageDescriptionDictionary:
          RunRoute: Precise location draws your run's route on the map and measures how far you went. It's used only while the app times your run.
        NSMicrophoneUsageDescription: Cheat Days listens when you tap the microphone in a chat box, so you can say what you ate instead of typing it, records sound when you film a video for your story, and records voiceovers when you make a video edit.
        NSSpeechRecognitionUsageDescription: Cheat Days turns what you say into words in the chat box, on your iPhone where it can, and makes captions from what's said in your video edits, on your iPhone.
        NSHealthShareUsageDescription: Cheat Days reads your weight, body fat, lean mass, BMI, steps, and workouts with their routes, heart rate and calories from Apple Health, so weigh-ins from your smart scale's app arrive on their own, Today can show your steps, the runs and classes in your plan tick themselves off with their maps, and each workout shows your heart rate.
        NSHealthUpdateUsageDescription: Cheat Days saves the runs, rides, walks and workouts it times for you to Apple Health as workouts, with their distance, active energy and routes. It never changes anything else in your Health data.
        # Start running's run: it keeps speaking, and (when mapped) following the route, with the phone locked.
        # (workout-processing is watchOS only: App Store validation refused it in 1.4.54)
        UIBackgroundModes:
          - audio
          - location
          # the heart strap keeps reading with the phone locked
          - bluetooth-central
        # a heart strap, only when they connect one (26 Nov, design/heart-rate-mockup.html)
        NSBluetoothAlwaysUsageDescription: Cheat Days connects to a Bluetooth heart strap when you ask it to, to show your heart rate live while you run, ride or time a workout. It doesn't look for or connect to anything else.
        NSSupportsLiveActivities: true
        # the web app's own domain, so its offline cache (service worker) works inside the app
        WKAppBoundDomains:
          - domchivers.github.io
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        # the editor's text fonts (CheatDays/Fonts, SIL Open Font Licence)
        UIAppFonts:
          - Anton-Regular.ttf
          - BebasNeue-Regular.ttf
          - ArchivoBlack-Regular.ttf
          - Bangers-Regular.ttf
          - Pacifico-Regular.ttf
          - Lobster-Regular.ttf
          - CaveatBrush-Regular.ttf
          - AbrilFatface-Regular.ttf
          - Righteous-Regular.ttf
          - PressStart2P-Regular.ttf
          - Monoton-Regular.ttf
          - DancingScript.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cheatdays.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: CheatDays/CheatDays.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  RestTimer:
    type: app-extension
    platform: iOS
    sources:
      - path: RestTimer
      - path: Shared
    info:
      path: RestTimer/Info.plist
      properties:
        CFBundleDisplayName: Workout timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cheatdays.app.RestTimer
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: RestTimer/RestTimer.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  CheatDaysTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CheatDaysTests
    dependencies:
      - target: CheatDays
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CheatDaysUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CheatDaysUITests
    dependencies:
      - target: CheatDays
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CheatDays
schemes:
  # run by hand on the Mac (simulator): xcodebuild test -scheme CheatDaysUITests
  CheatDaysUITests:
    build:
      targets:
        CheatDays: all
        CheatDaysUITests: [test]
    test:
      targets:
        - CheatDaysUITests
  CheatDays:
    build:
      targets:
        CheatDays: all
        RestTimer: all
        CheatDaysTests: [test]
    test:
      targets:
        - CheatDaysTests
