# The Cheat Days iPhone app. XcodeGen turns this into CheatDays.xcodeproj on the Mac:
#   brew install xcodegen && cd native && xcodegen generate
# The app is a native shell around the web app (loaded from GitHub Pages, so web changes reach it
# without a new build) plus the native parts a web page can't do: the workout timer on the lock
# screen and in the Dynamic Island, a "rest's over" alert while the phone is locked, and haptics.
name: CheatDays
options:
  bundleIdPrefix: com.cheatdays
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CheatDays:
    type: application
    platform: iOS
    sources:
      - path: CheatDays
      - path: Shared
    dependencies:
      - target: RestTimer
    info:
      path: CheatDays/Info.plist
      properties:
        CFBundleDisplayName: Cheat Days
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSCameraUsageDescription: Cheat Days uses the camera to scan barcodes and take photos of food labels and packs.
        NSPhotoLibraryUsageDescription: Cheat Days lets you pick a photo of food or a label from your library.
        NSSupportsLiveActivities: true
        # the web app's own domain, so its offline cache (service worker) works inside the app
        WKAppBoundDomains:
          - domchivers.github.io
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cheatdays.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  RestTimer:
    type: app-extension
    platform: iOS
    sources:
      - path: RestTimer
      - path: Shared
    info:
      path: RestTimer/Info.plist
      properties:
        CFBundleDisplayName: Workout timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cheatdays.app.RestTimer
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  CheatDays:
    build:
      targets:
        CheatDays: all
        RestTimer: all
